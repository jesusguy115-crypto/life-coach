name: Skill checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image dependencies
        run: |
          python -m pip install 'Pillow>=10,<13'
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Test input, references, and image output
        run: python -m unittest discover -s resources/tests -v
